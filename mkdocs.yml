site_name: Aletheia Wiki
site_description: Documentation for Aletheia, an open-source quantitative fund analysis and forecasting platform.
site_author: Aletheia contributors
repo_name: aletheia
repo_url: https://github.com/aletheia
edit_uri: edit/main/docs/
use_directory_urls: true
copyright: "Aletheia 2.7.3 | Scientific 2.12.0-causal-horizon-integrity | MIT License | EIDO Automation"

theme:
  name: material
  language: en
  logo: assets/eido_logo.png
  favicon: assets/eido_logo.png
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/chart-line

plugins:
  - search

extra_css:
  - stylesheets/aletheia.css

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/vendor/mathjax-3.2.2-tex-svg.js
  - javascripts/vendor/mermaid-10.9.1.min.js
  - javascripts/mermaid.js

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn

